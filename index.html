<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="混经：混的人指南。一部以道、佛、八字、六爻、占星、塔罗为方法论的当代生活糊弄学经典。搞笑，但有哲学深意。" />
  <meta name="theme-color" content="#f5efe2" />
  <title>混经 · 混的人指南</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='8' fill='%23a03a2e'/%3E%3Ctext x='32' y='46' font-size='40' font-family='serif' font-weight='700' fill='%23f5efe2' text-anchor='middle'%3E%E6%B7%B7%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/style.css?v=10" />
</head>
<body>
  <div id="app" class="boot">正在焚香净手，翻开经书……</div>
  <script>
    window.$docsify = {
      name: '混经',
      repo: 'fatasia/PrankHandbook',
      homepage: 'xuyan.md',
      loadSidebar: true,
      subMaxLevel: 2,
      coverpage: true,
      onlyCover: true,
      auto2top: true,
      search: {
        placeholder: { '/': '搜索经文' },
        noData: '查无此卦',
        depth: 3,
      },
      count: {
        countable: true,
        position: 'bottom',
        margin: '16px auto',
        float: 'right',
        fontsize: '0.75em',
        color: '#a03a2e',
        language: 'chinese',
      },
      plugins: [
        function (hook) {
          var KEY = 'hunjing-sidebar';
          var mobile = window.matchMedia('(max-width: 768px)');
          var desktopClosed = false;
          var closed = true;
          var btn, sidebar, backdrop, content;
          try {
            desktopClosed = localStorage.getItem(KEY) === 'close';
          } catch (_) { /* 禁用存储时仍可正常切换目录。 */ }

          function setClosed(value, restoreFocus) {
            closed = value;
            if (!btn) return;
            var onCover = !!document.querySelector('section.cover.show');
            var expanded = !closed && !onCover;
            document.body.classList.toggle('sidebar-closed', closed);
            document.body.classList.toggle('sidebar-mobile-open', mobile.matches && expanded);
            btn.hidden = onCover;
            btn.setAttribute('aria-expanded', String(expanded));
            btn.setAttribute('aria-label', expanded ? '收起目录' : '展开目录');
            btn.title = expanded ? '收起目录' : '展开目录';
            sidebar.inert = !expanded;
            sidebar.setAttribute('aria-hidden', String(!expanded));
            backdrop.hidden = !mobile.matches || !expanded;
            content.inert = mobile.matches && expanded;
            if (restoreFocus && !onCover) btn.focus({ preventScroll: true });
          }

          hook.ready(function () {
            sidebar = document.querySelector('.sidebar');
            content = document.querySelector('.content');
            var original = document.querySelector('.sidebar-toggle');
            if (!sidebar || !content || !original) return;

            // 使用独立状态和按钮，避免与 Docsify 移动端 close 的反向语义冲突。
            btn = original.cloneNode(true);
            original.replaceWith(btn);
            btn.type = 'button';
            sidebar.id = 'book-sidebar';
            var heading = document.createElement('div');
            heading.className = 'sidebar-heading';
            heading.textContent = '目录';
            sidebar.prepend(heading);
            btn.setAttribute('aria-controls', sidebar.id);
            backdrop = document.createElement('div');
            backdrop.className = 'sidebar-backdrop';
            backdrop.hidden = true;
            backdrop.setAttribute('aria-hidden', 'true');
            sidebar.parentNode.appendChild(backdrop);
            setClosed(mobile.matches || desktopClosed);

            btn.addEventListener('click', function (e) {
              e.stopPropagation();
              setClosed(!closed);
              if (!mobile.matches) {
                desktopClosed = closed;
                try {
                  localStorage.setItem(KEY, closed ? 'close' : 'open');
                } catch (_) { /* 存储不可用不影响阅读。 */ }
              }
            });
            sidebar.addEventListener('click', function (e) {
              if (mobile.matches && e.target.closest('a[href]')) setClosed(true, true);
            });
            backdrop.addEventListener('click', function () { setClosed(true, true); });
            document.addEventListener('keydown', function (e) {
              if (!mobile.matches || closed) return;
              if (e.key === 'Escape') {
                e.preventDefault();
                setClosed(true, true);
              }
              if (e.key === 'Tab') {
                var items = [btn].concat(Array.from(sidebar.querySelectorAll('a[href], input, button, [tabindex="0"]')))
                  .filter(function (el) { return !el.disabled && el.getClientRects().length; });
                var index = items.indexOf(document.activeElement);
                if (e.shiftKey && index <= 0) {
                  e.preventDefault();
                  items[items.length - 1].focus();
                } else if (!e.shiftKey && (index === -1 || index === items.length - 1)) {
                  e.preventDefault();
                  items[0].focus();
                }
              }
            });
            mobile.addEventListener('change', function () {
              setClosed(mobile.matches || desktopClosed);
            });
            window.addEventListener('hashchange', function () {
              if (mobile.matches) setClosed(true);
            });
          });
          hook.doneEach(function () {
            setClosed(mobile.matches || closed);
          });
        },
        function (hook) {
          // 封面独占一屏（onlyCover），进入路径只剩这个承诺：按 Enter 或点击任意处
          hook.ready(function () {
            function onCover() {
              return !!document.querySelector('section.cover.show');
            }
            function enter() {
              location.hash = '#/xuyan.md';
            }
            function isTyping(t) {
              return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
            }
            document.addEventListener('keydown', function (e) {
              if (e.key !== 'Enter' || !onCover() || isTyping(e.target)) return;
              enter();
            });
            document.addEventListener('click', function (e) {
              if (!onCover() || !e.target.closest) return;
              if (e.target.closest('a') || !e.target.closest('section.cover')) return;
              enter();
            });
          });
        },
      ],
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-count@1/dist/count.min.js"></script>
</body>
</html>
